name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Third-party actions are pinned to full commit SHAs (release tag in the comment).
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
      - name: Install pinned Neovim, OMP, and Poppler
        run: bash ci/setup-tools.sh
      - name: Assert tool versions (missing prerequisites fail the job)
        run: bash ci/preflight.sh
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build and verify dist/ matches the committed bundle
        run: |
          npm run build
          node ci/check-dist.mjs
      - name: Test
        run: |
          # setup-tools' chosen Poppler directory goes in front of PATH so
          # node's child processes cannot resolve inherited Xpdf tools (Windows).
          if [ -n "${PI_VIEW_POPPLER_BIN:-}" ]; then
            poppler_bin="$PI_VIEW_POPPLER_BIN"
            # Drive paths (C:/...) must become POSIX before a colon-separated PATH.
            if command -v cygpath >/dev/null 2>&1; then poppler_bin="$(cygpath -u "$poppler_bin")"; fi
            export PATH="$poppler_bin:$PATH"
          fi
          npm test
